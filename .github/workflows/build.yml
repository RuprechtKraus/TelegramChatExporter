name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore TelegramChatExporter.slnx
      - run: dotnet build TelegramChatExporter.slnx --configuration Release --no-restore
      - run: dotnet test TelegramChatExporter.slnx --configuration Release --no-build --verbosity normal
